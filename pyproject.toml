[project]
name = "ndmanager"
version = "0.7.0"
readme = "README.md"
authors = [{ name = "Nicolas Linden", email = "nicolas@nlinden.com" }]
description = "Managing you nuclear data collection"
classifiers = ["Programming Language :: Python :: 3.11"]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "click>=8.3.1",
    "endf>=0.1.4",
    "h5py>=3.14.0",
    "lxml>=6.0.0",
    "matplotlib>=3.10.3",
    "numpy<2.3",
    "pandas>=2.3.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "rich>=14.2.0",
    "sandy>=1.1.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/nplinden/ndmanager"

[project.scripts]
ndf = "ndmanager.CLI.ndf:ndf"
ndo = "ndmanager.CLI.ndo:ndo"
# ndo = "ndmanager.CLI.omcer.main:main"
ndc = "ndmanager.CLI.chainer.main:main"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
env = [
    "NDMANAGER_ENDF6=pytest-artifacts/endf6",
    "NDMANAGER_HDF5=pytest-artifacts/hdf5",
    "NDMANAGER_CHAINS=pytest-artifacts/chains",
]

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "coverage>=7.9.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-env>=1.1.5",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "pydata-sphinx-theme>=0.16.1",
]

[tool.ruff]
line-length = 120
exclude = ["src/ndmanager/_vendor"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "N806",
    "S314",
    "S324",
    "N803",
    "D100",
    "D104",
    "COM812",
    "ISC001",
    "ARG001",
    "ANN002",
    "ANN003",
    "RUF012",
]
